# =============================================================================
# 随手学 kb-mcp 配置文件（示例）
#
# 使用前请复制为 config.yaml：
#   cp config.example.yaml config.yaml
#
# 所有相对路径以 kb-mcp/ 目录为基准解析。也可使用绝对路径。
# 环境变量 SUISHOUXUE_CARDS_DIR / SUISHOUXUE_PROFILES_DIR /
# SUISHOUXUE_DEFAULT_PROFILE 可覆盖以下对应设置。
# =============================================================================

# ---------------------------------------------------------------------------
# 基础设置（Lite 版 — 本地使用，无需任何外部服务）
# ---------------------------------------------------------------------------

# 知识卡片存储目录
cards_dir: "./cards"

# Profile 模板目录（定义卡片字段结构）
profiles_dir: "../profiles"

# 默认 Profile 名称（对应 profiles_dir 下的 YAML 文件名，不含扩展名）
default_profile: "general"

# ---------------------------------------------------------------------------
# 搜索设置
# ---------------------------------------------------------------------------
search:
  # 搜索引擎类型：grep = 简单文本匹配（Lite 版默认）
  engine: "grep"

  # 默认返回结果数量上限
  default_limit: 10

  # 搜索时是否区分大小写（仅 grep 引擎有效）
  case_sensitive: false

# ---------------------------------------------------------------------------
# 未来功能与发布计划请关注项目 CHANGELOG 和 GitHub Releases。
# ---------------------------------------------------------------------------
