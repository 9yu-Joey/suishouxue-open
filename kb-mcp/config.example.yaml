# =============================================================================
# 随手学 kb-mcp 配置文件（示例）
#
# 使用前请复制为 config.yaml：
#   cp config.example.yaml config.yaml
#
# 所有相对路径以 kb-mcp/ 目录为基准解析。也可使用绝对路径。
# 以 SUISHOUXUE_ 开头的环境变量可覆盖以下对应设置（见 .env.example）。
# 优先级：系统环境变量 > kb-mcp/.env > config.yaml > 默认值。
# =============================================================================

# ---------------------------------------------------------------------------
# 基础设置（Lite 版 — 本地使用，无需任何外部服务）
# ---------------------------------------------------------------------------

# 知识卡片存储目录
cards_dir: "./cards"

# Profile 模板目录（定义卡片字段结构）
profiles_dir: "../profiles"

# 默认 Profile 名称（对应 profiles_dir 下的 YAML 文件名，不含扩展名）
default_profile: "general"

# ---------------------------------------------------------------------------
# 搜索设置
# ---------------------------------------------------------------------------
search:
  # 搜索引擎类型：grep = 简单文本匹配（Lite 版默认）
  engine: "grep"

  # 默认返回结果数量上限
  default_limit: 10

  # 搜索时是否区分大小写（仅 grep 引擎有效）
  case_sensitive: false

# ---------------------------------------------------------------------------
# Pro：Git 同步（可选，默认关闭）
#
# 开启前，cards_dir 必须是一个独立的 Git 仓库（建议是你自己的 private 仓库），
# 并已用 `git remote add` 配好远端。认证交给你自己的 SSH key 或
# Git credential helper —— 不要把 token 写进这里。
# 详见 docs/05-Pro-同步与展示.md
# ---------------------------------------------------------------------------
sync:
  # true = kb_save / kb_update 后自动本地提交，并可用 kb_sync 同步
  enabled: false

  # Git remote 名称（不是 URL）
  remote: "origin"

  # 远端分支
  branch: "main"

# ---------------------------------------------------------------------------
# Pro：静态站点（build_site.py）
#
# 只有 tags 里带 publish_tag 的卡片会被生成。私有仓库 ≠ 私有网站。
# ---------------------------------------------------------------------------
site:
  publish_tag: "public"
  title: "我的随手学知识库"
  output_dir: "./site"

# ---------------------------------------------------------------------------
# Private：HTTP 自托管（只在 `python server.py --transport http` 时使用）
#
# 认证不可关闭：没有有效访问令牌时服务拒绝启动。
# 本程序不处理 HTTPS，公网访问必须放在 HTTPS 反向代理后面（见 deploy/）。
# 详见 docs/06-Private-自托管部署.md
# ---------------------------------------------------------------------------
http:
  # 默认只监听本机
  host: "127.0.0.1"
  port: 8765

  # 访问令牌文件（只存哈希）。用 `python auth_tokens.py create <设备名>` 签发
  tokens_file: "./tokens.json"

  # 监听非本机地址（如 0.0.0.0）必须显式开启，并确保前面有 HTTPS 反向代理
  allow_remote_bind: false

  # 允许的 Host（你的域名），用于防 DNS 重绑定
  allowed_hosts: []
